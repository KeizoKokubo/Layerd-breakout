<!DOCTYPE html>

<title>Glass Breakout — three.js ブロック崩し</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background:
      radial-gradient(1200px 700px at 20% -10%, #2b3a67 0%, transparent 60%),
      radial-gradient(1000px 800px at 90% 110%, #4a235a 0%, transparent 55%),
      linear-gradient(160deg, #070b1d 0%, #101736 55%, #1b1040 100%);
    color: #eef2ff;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; pointer-events: none; z-index: 5;
  }
  .hud-box {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px; padding: 8px 16px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-size: 15px; letter-spacing: .04em; min-width: 118px; text-align: center;
  }
  .hud-box .label { font-size: 10px; opacity: .65; display: block; letter-spacing: .18em; }
  .hud-box .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #lives .value { color: #ff8fab; letter-spacing: .1em; font-size: 17px; }
  #title-badge {
    font-weight: 800; font-size: 17px; letter-spacing: .12em;
    text-shadow: 0 0 18px rgba(120,180,255,.8);
  }
  #sound-btn {
    pointer-events: auto; cursor: pointer; border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.08); color: #eef2ff; border-radius: 12px;
    padding: 10px 14px; font-size: 15px; backdrop-filter: blur(8px);
  }
  #sound-btn:hover { background: rgba(255,255,255,0.16); }

  /* ---------- Overlay ---------- */
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: rgba(5, 8, 24, 0.45);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    transition: opacity .25s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .card {
    text-align: center; padding: 38px 48px; border-radius: 22px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    max-width: min(520px, 90vw);
  }
  .card h1 {
    font-size: clamp(26px, 5vw, 40px); letter-spacing: .06em; margin-bottom: 10px;
    background: linear-gradient(90deg, #8fd3ff, #c39bff, #ff9ecb);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .card p { font-size: 15px; line-height: 1.8; opacity: .9; margin-bottom: 22px; white-space: pre-line; }
  #start-btn {
    cursor: pointer; border: none; border-radius: 999px;
    padding: 13px 42px; font-size: 17px; font-weight: 700; letter-spacing: .08em;
    color: #0b1030; background: linear-gradient(90deg, #8fd3ff, #c39bff);
    box-shadow: 0 8px 28px rgba(140,170,255,.45);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  #start-btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 12px 34px rgba(140,170,255,.6); }
  #start-btn:active { transform: scale(.97); }

  #hint {
    position: fixed; bottom: 12px; left: 0; right: 0; z-index: 5;
    text-align: center; font-size: 12.5px; opacity: .65; pointer-events: none; letter-spacing: .05em;
  }
  @media (max-width: 640px) {
    .hud-box { min-width: 84px; padding: 6px 10px; }
    .hud-box .value { font-size: 16px; }
    #title-badge { display: none; }
    .card { padding: 28px 24px; }
  }
</style>

<body>
<div id="app"></div>

<div id="hud">
  <div class="hud-box"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
  <div id="title-badge">✦ GLASS BREAKOUT ✦</div>
  <div style="display:flex; gap:10px; align-items:stretch;">
    <div class="hud-box"><span class="label">LEVEL</span><span class="value" id="level">1</span></div>
    <div class="hud-box" id="lives"><span class="label">BALL</span><span class="value" id="lives-value">●●●</span></div>
    <button id="sound-btn" title="サウンド ON/OFF">🔊</button>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <h1 id="overlay-title">GLASS BREAKOUT</h1>
    <p id="overlay-text">半透明のガラスブロックを全部壊そう。
パドルは マウス / ←→キー / タッチ で動くよ。
クリックかスペースでボール発射！</p>
    <button id="start-btn">▶ スタート</button>
  </div>
</div>

<div id="hint">マウス・←→・タッチで移動 ／ スペース：発射・一時停止 ／ R：リスタート</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   Glass Breakout — three.js ブロック崩し
   ・描画は three.js（半透明マテリアル＋輪郭線でガラス感）
   ・座標系は (u, v)：u = パドル→ブロック方向、v = パドルの移動軸
   ・レイアウトはウィンドウの形で決まる：横長なら横レイアウト
     （U=25.6、距離を離して操作の余裕を作る）、縦長なら縦
     （U は窓の縦長さに合わせて伸ばし、画面いっぱいに広げる）。
     プレイ中のリサイズにも追従し、状態を引き継いで切り替わる
   ============================================================ */

// ---------- レイアウト定数 ----------
const COLS = 9, ROWS = 5;
const BLOCK_SU = 0.74, GAP_U = 0.18, GAP_V = 0.13;
const PADDLE_U = 1.0, PADDLE_LEN = 2.9, PADDLE_THICK = 0.36;
const BALL_R = 0.30;
const ROW_COLORS = [0xff5d8f, 0xffa94d, 0xffe066, 0x69db7c, 0x4dd0e1];
const ROW_POINTS = [50, 40, 30, 20, 10];

// ---------- 表示モード（ウィンドウのアスペクト比で決まる） ----------
let LANDSCAPE = (innerWidth / innerHeight) >= 1.0;
let FIELD = { U: 12.8, V: 16.6 }, SPEED_MUL = 1, BLOCK_SV = 1.6, SPAN_V = 0, VIEW = { w: 0, h: 0 };
function dimsFor(landscape, aspect) {
  if (landscape) return { U: 25.6, V: 15.2, mul: 1.25 };
  // 縦レイアウトは窓の縦長さに合わせて U を伸ばし、
  // ブロックとパドルが画面の上下いっぱいに広がるようにする。
  // 速度は U に比例させ、画面上で見たボールの速さ感を変えない。
  const U = Math.min(34, Math.max(12.8, (16.6 + 1.6) / aspect - 1.6));
  return { U, V: 16.6, mul: U / 12.8 };
}
function computeLayout(aspect) {
  const d = dimsFor(LANDSCAPE, aspect);
  FIELD = { U: d.U, V: d.V };
  SPEED_MUL = d.mul;
  BLOCK_SV = Math.min(1.6, (FIELD.V - 1.2 - (COLS - 1) * GAP_V) / COLS);
  SPAN_V = COLS * BLOCK_SV + (COLS - 1) * GAP_V;
  VIEW = LANDSCAPE ? { w: FIELD.U + 1.6, h: FIELD.V + 1.6 } : { w: FIELD.V + 1.6, h: FIELD.U + 1.6 };
}
computeLayout(innerWidth / innerHeight);
document.body.classList.add(LANDSCAPE ? 'landscape' : 'portrait');

function toWorld(u, v) {
  return LANDSCAPE ? { x: u - FIELD.U / 2, y: v } : { x: v, y: u - FIELD.U / 2 };
}
function makeUVBox(su, sv, sz, mat) {
  const geo = LANDSCAPE ? new THREE.BoxGeometry(su, sv, sz) : new THREE.BoxGeometry(sv, su, sz);
  return new THREE.Mesh(geo, mat);
}
function placeUV(obj, u, v, z) {
  const w = toWorld(u, v);
  obj.position.set(w.x, w.y, z);
}
function disposeObj(root) {
  root.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose());
  });
}

// ---------- 状態 ----------
let state = 'ready'; // ready | playing | paused | over | clear
let score = 0, lives = 3, level = 1;
let paddleV = 0, paddleTargetV = 0;
const keys = { left: false, right: false, up: false, down: false };

// ---------- シーン ----------
const container = document.getElementById('app');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0f2a, 17, 40);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 120);
function fitCamera() {
  const aspect = innerWidth / innerHeight;
  camera.aspect = aspect;
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(VIEW.h / 2, (VIEW.w / 2) / aspect) / t * 1.03;
  scene.fog.near = dist * 0.9;
  scene.fog.far = dist * 2.3;
  camera.position.set(0, 0, dist);
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
}
fitCamera();

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
container.appendChild(renderer.domElement);

// ---------- ライト ----------
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
dirLight.position.set(6, 10, 8);
scene.add(dirLight);
const backLight = new THREE.DirectionalLight(0x7aa2ff, 0.7);
backLight.position.set(-8, -4, 6);
scene.add(backLight);

// ---------- 背景の星屑 ----------
{
  const N = 260, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    pos[i * 3] = (Math.random() - 0.5) * 52;
    pos[i * 3 + 1] = (Math.random() - 0.5) * 30;
    pos[i * 3 + 2] = -6 - Math.random() * 10;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    color: 0xaac4ff, size: 0.09, transparent: true, opacity: 0.75
  })));
}

// ---------- ボール ----------
const ball = {
  u: 0, v: 0, vu: 0, vv: 0, speed: 7.2,
  mesh: new THREE.Group(), trail: [], trailT: 0,
};
{
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(BALL_R, 32, 32),
    new THREE.MeshPhysicalMaterial({
      color: 0xffffff, emissive: 0xbfd9ff, emissiveIntensity: 1.4,
      roughness: 0.15, metalness: 0, clearcoat: 1
    })
  );
  ball.mesh.add(core);
  ball.mesh.add(new THREE.PointLight(0x9fc8ff, 26, 11, 1.8));
  scene.add(ball.mesh);
  const tGeo = new THREE.SphereGeometry(BALL_R, 16, 16);
  for (let i = 0; i < 10; i++) {
    const m = new THREE.Mesh(tGeo, new THREE.MeshBasicMaterial({
      color: 0x8fc4ff, transparent: true, opacity: 0
    }));
    scene.add(m);
    ball.trail.push(m);
  }
}

// ---------- ブロック ----------
const blocks = [];
const blockGroup = new THREE.Group();
scene.add(blockGroup);
function buildBlocks(preserve = false) {
  const prevAlive = preserve ? blocks.map((b) => b.alive) : null;
  for (const b of blocks) { blockGroup.remove(b.mesh); disposeObj(b.mesh); }
  blocks.length = 0;
  let idx = 0;
  for (let r = 0; r < ROWS; r++) {
    const color = ROW_COLORS[r % ROW_COLORS.length];
    const geo = LANDSCAPE ? new THREE.BoxGeometry(BLOCK_SU, BLOCK_SV, 0.65)
                          : new THREE.BoxGeometry(BLOCK_SV, BLOCK_SU, 0.65);
    for (let c = 0; c < COLS; c++) {
      const mat = new THREE.MeshPhysicalMaterial({
        color, transparent: true, opacity: 0.62,
        roughness: 0.12, metalness: 0.05, clearcoat: 1,
        emissive: color, emissiveIntensity: 0.18
      });
      const mesh = new THREE.Mesh(geo, mat);
      const edge = new THREE.LineSegments(
        new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 })
      );
      mesh.add(edge);
      const u = FIELD.U - 1.5 - r * (BLOCK_SU + GAP_U);
      const v = -SPAN_V / 2 + BLOCK_SV / 2 + c * (BLOCK_SV + GAP_V);
      placeUV(mesh, u, v, 0);
      const alive = prevAlive ? prevAlive[idx] : true;
      mesh.visible = alive;
      blockGroup.add(mesh);
      blocks.push({ mesh, alive, row: r, u, v });
      idx++;
    }
  }
}

// ---------- フィールド構築（パネル・枠・パドル：レイアウトごとに作り直す） ----------
let fieldGroup = null;
let paddle = null;
function buildField() {
  if (fieldGroup) { scene.remove(fieldGroup); disposeObj(fieldGroup); }
  fieldGroup = new THREE.Group();
  scene.add(fieldGroup);

  const panel = new THREE.Mesh(
    new THREE.PlaneGeometry(VIEW.w + 1.5, VIEW.h + 1.5),
    new THREE.MeshBasicMaterial({ color: 0x0d1440, transparent: true, opacity: 0.45 })
  );
  panel.position.z = -0.9;
  fieldGroup.add(panel);

  const frameMat = new THREE.MeshPhysicalMaterial({
    color: 0xbfe3ff, transparent: true, opacity: 0.35,
    roughness: 0.1, metalness: 0.1, clearcoat: 1
  });
  const mk = (su, sv, u, v) => {
    const m = makeUVBox(su, sv, 0.5, frameMat);
    placeUV(m, u, v, 0);
    fieldGroup.add(m);
  };
  mk(FIELD.U + 0.8, 0.28, FIELD.U / 2, -(FIELD.V / 2 + 0.35));
  mk(FIELD.U + 0.8, 0.28, FIELD.U / 2, FIELD.V / 2 + 0.35);
  mk(0.28, FIELD.V + 1.0, FIELD.U + 0.35, 0);

  paddle = new THREE.Group();
  const bar = makeUVBox(PADDLE_THICK, PADDLE_LEN, 0.55, new THREE.MeshPhysicalMaterial({
    color: 0x66d9ff, transparent: true, opacity: 0.85,
    roughness: 0.08, metalness: 0.15, clearcoat: 1,
    emissive: 0x1166aa, emissiveIntensity: 0.55
  }));
  paddle.add(bar);
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(bar.geometry),
    new THREE.LineBasicMaterial({ color: 0xe8fbff, transparent: true, opacity: 0.95 })
  );
  bar.add(edges);
  placeUV(paddle, PADDLE_U, paddleV, 0);
  fieldGroup.add(paddle);

  buildBlocks(true);
}

// ---------- レイアウト切り替え ----------
function setHint() {
  document.getElementById('hint').textContent = LANDSCAPE
    ? 'マウス・↑↓・タッチで移動 ／ スペース：発射・一時停止 ／ R：リスタート'
    : 'マウス・←→・タッチで移動 ／ スペース：発射・一時停止 ／ R：リスタート';
}
function applyLayout(toLandscape, aspect) {
  const oldU = FIELD.U, oldV = FIELD.V, oldMul = SPEED_MUL;
  LANDSCAPE = toLandscape;
  computeLayout(aspect);
  const ru = FIELD.U / oldU, rv = FIELD.V / oldV;
  paddleV *= rv;
  paddleTargetV *= rv;
  ball.u *= ru;
  ball.v *= rv;
  ball.speed *= SPEED_MUL / oldMul;
  if (state === 'playing') {
    const m = Math.hypot(ball.vu, ball.vv) || 1;
    ball.vu = ball.vu / m * ball.speed;
    ball.vv = ball.vv / m * ball.speed;
  }
  if (state !== 'ready') placeUV(ball.mesh, ball.u, ball.v, 0);
  buildField();
  document.body.classList.toggle('landscape', LANDSCAPE);
  document.body.classList.toggle('portrait', !LANDSCAPE);
  setHint();
  fitCamera();
}

// ---------- 破片パーティクル ----------
const particles = [];
{
  const geo = new THREE.BoxGeometry(0.13, 0.13, 0.13);
  for (let i = 0; i < 140; i++) {
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 }));
    mesh.visible = false;
    scene.add(mesh);
    particles.push({ mesh, vel: new THREE.Vector3(), life: 0, maxLife: 0 });
  }
}
function burst(x, y, z, colorHex) {
  let spawned = 0;
  for (const p of particles) {
    if (p.life > 0) continue;
    p.mesh.visible = true;
    p.mesh.material.color.setHex(colorHex);
    p.mesh.position.set(x, y, z);
    const a = Math.random() * Math.PI * 2, sp = 1.6 + Math.random() * 3.4;
    p.vel.set(Math.cos(a) * sp, Math.sin(a) * sp, (Math.random() - 0.5) * 2.2);
    p.maxLife = p.life = 0.45 + Math.random() * 0.35;
    p.mesh.rotation.set(Math.random() * 3, Math.random() * 3, 0);
    if (++spawned >= 10) break;
  }
}
function updateParticles(dt) {
  for (const p of particles) {
    if (p.life <= 0) continue;
    p.life -= dt;
    if (p.life <= 0) { p.mesh.visible = false; p.mesh.material.opacity = 0; continue; }
    p.vel.y -= 4.5 * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    p.mesh.rotation.x += dt * 7; p.mesh.rotation.y += dt * 9;
    const t = p.life / p.maxLife;
    p.mesh.material.opacity = 0.9 * t;
    p.mesh.scale.setScalar(0.4 + 0.6 * t);
  }
}

// ---------- サウンド ----------
let audioCtx = null, soundOn = true;
function beep(freq, dur = 0.06, type = 'square', vol = 0.05) {
  if (!soundOn) return;
  try {
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch { /* 音が出ない環境では黙って続行 */ }
}
document.getElementById('sound-btn').addEventListener('click', (e) => {
  soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? '🔊' : '🔇';
});

// ---------- HUD / オーバーレイ ----------
const el = {
  score: document.getElementById('score'),
  level: document.getElementById('level'),
  lives: document.getElementById('lives-value'),
  overlay: document.getElementById('overlay'),
  oTitle: document.getElementById('overlay-title'),
  oText: document.getElementById('overlay-text'),
  oBtn: document.getElementById('start-btn'),
};
function refreshHUD() {
  el.score.textContent = score;
  el.level.textContent = level;
  el.lives.textContent = '●'.repeat(Math.max(lives, 0)) + '○'.repeat(Math.max(3 - lives, 0));
}
function showOverlay(title, text, btn) {
  el.oTitle.textContent = title;
  el.oText.textContent = text;
  el.oBtn.textContent = btn;
  el.overlay.classList.remove('hidden');
}
function hideOverlay() { el.overlay.classList.add('hidden'); }

// ---------- ゲーム進行 ----------
function ballHomeU() { return PADDLE_U + PADDLE_THICK / 2 + BALL_R + 0.02; }
function parkBall() {
  ball.u = ballHomeU();
  ball.v = paddleV;
  placeUV(ball.mesh, ball.u, ball.v, 0);
}
function launchBall() {
  if (state !== 'ready') return;
  state = 'playing';
  const ang = THREE.MathUtils.degToRad((15 + Math.random() * 35) * (Math.random() < 0.5 ? -1 : 1));
  ball.vu = Math.cos(ang) * ball.speed;
  ball.vv = Math.sin(ang) * ball.speed;
  beep(660, 0.07, 'sine', 0.06);
}
function resetGame(newLevel = 1) {
  level = newLevel;
  if (newLevel === 1) { score = 0; lives = 3; }
  ball.speed = 7.2 * SPEED_MUL + (level - 1) * 0.9;
  paddleV = 0; paddleTargetV = 0;
  placeUV(paddle, PADDLE_U, 0, 0);
  buildBlocks();
  for (const m of ball.trail) m.material.opacity = 0;
  state = 'ready';
  ball.vu = 0; ball.vv = 0;
  parkBall();
  refreshHUD();
}
function loseBall() {
  for (const m of ball.trail) m.material.opacity = 0;
  lives--;
  refreshHUD();
  beep(160, 0.25, 'sawtooth', 0.06);
  const w = toWorld(0.2, ball.v);
  burst(w.x, w.y, 0, 0x8899bb);
  if (lives <= 0) {
    state = 'over';
    showOverlay('GAME OVER', `スコアは ${score} 点だったよ。\nもう一度挑戦してみよう！`, '↻ もう一度');
  } else {
    state = 'ready';
    ball.vu = 0; ball.vv = 0;
    parkBall();
  }
}
function clearLevel() {
  state = 'clear';
  score += 500;
  refreshHUD();
  beep(523, 0.1, 'sine', 0.06);
  setTimeout(() => beep(784, 0.14, 'sine', 0.06), 110);
  showOverlay('LEVEL CLEAR! 🎉', `ボーナス +500点！ スコア ${score} 点。\n次のレベルはボールの速度が上がるよ。`, `▶ レベル ${level + 1} へ`);
}
el.oBtn.addEventListener('click', () => {
  if (state === 'over') { resetGame(1); hideOverlay(); launchBall(); }
  else if (state === 'clear') { resetGame(level + 1); hideOverlay(); launchBall(); }
  else if (state === 'ready' && score === 0 && lives === 3) { hideOverlay(); launchBall(); }
  else if (state === 'paused') { state = 'playing'; hideOverlay(); }
});

// ---------- 入力 ----------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const worldPlaneZ0 = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
function pointerToV(clientX, clientY) {
  ndc.set((clientX / innerWidth) * 2 - 1, -((clientY / innerHeight) * 2 - 1));
  raycaster.setFromCamera(ndc, camera);
  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(worldPlaneZ0, hit)) return null;
  return LANDSCAPE ? hit.y : hit.x;
}
addEventListener('pointermove', (e) => {
  const v = pointerToV(e.clientX, e.clientY);
  if (v !== null && isFinite(v)) paddleTargetV = v;
});
addEventListener('pointerdown', (e) => {
  if (e.target.closest('#overlay, #sound-btn')) return;
  const v = pointerToV(e.clientX, e.clientY);
  if (v !== null && isFinite(v)) paddleTargetV = v;
  if (state === 'ready') launchBall();
  else if (state === 'paused') { state = 'playing'; hideOverlay(); }
});
addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') { keys.up = true; e.preventDefault(); }
  if (e.code === 'ArrowDown' || e.code === 'KeyS') { keys.down = true; e.preventDefault(); }
  if (e.code === 'Space') {
    e.preventDefault();
    if (state === 'ready') launchBall();
    else if (state === 'playing') { state = 'paused'; showOverlay('PAUSED', '一時停止中。', '▶ 再開する'); }
    else if (state === 'paused') { state = 'playing'; hideOverlay(); }
  }
  if (e.code === 'KeyR' && state !== 'ready') { resetGame(1); hideOverlay(); launchBall(); }
});
addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
});
let resizeTimer = null;
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  fitCamera();
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const a = innerWidth / innerHeight;
    const want = a >= 1.05 ? true : a <= 0.95 ? false : LANDSCAPE;
    if (want !== LANDSCAPE) applyLayout(want, a);
    else if (!LANDSCAPE && Math.abs(dimsFor(false, a).U - FIELD.U) / FIELD.U > 0.12) applyLayout(false, a);
  }, 250);
});
setHint();

// ---------- 物理＆描画 ----------
const clock = new THREE.Clock();

function step(dt) {
  const KEY_SPEED = 13;
  if (!LANDSCAPE) {
    if (keys.left) paddleTargetV -= KEY_SPEED * dt;
    if (keys.right) paddleTargetV += KEY_SPEED * dt;
  } else {
    if (keys.up) paddleTargetV += KEY_SPEED * dt;
    if (keys.down) paddleTargetV -= KEY_SPEED * dt;
  }
  const limit = FIELD.V / 2 - PADDLE_LEN / 2;
  paddleTargetV = THREE.MathUtils.clamp(paddleTargetV, -limit, limit);
  paddleV += (paddleTargetV - paddleV) * Math.min(1, dt * 18);
  placeUV(paddle, PADDLE_U, paddleV, 0);
  paddle.rotation.z = LANDSCAPE ? 0 : THREE.MathUtils.clamp((paddleTargetV - paddleV) * -0.03, -0.06, 0.06);

  if (state === 'ready') parkBall();

  if (state === 'playing') {
    const steps = 3, sdt = dt / steps;
    const halfLen = PADDLE_LEN / 2;
    for (let s = 0; s < steps && state === 'playing'; s++) {
      ball.u += ball.vu * sdt;
      ball.v += ball.vv * sdt;

      if (ball.v - BALL_R < -FIELD.V / 2) { ball.v = -FIELD.V / 2 + BALL_R; ball.vv = Math.abs(ball.vv); beep(300, 0.04); }
      if (ball.v + BALL_R > FIELD.V / 2) { ball.v = FIELD.V / 2 - BALL_R; ball.vv = -Math.abs(ball.vv); beep(300, 0.04); }
      if (ball.u + BALL_R > FIELD.U) { ball.u = FIELD.U - BALL_R; ball.vu = -Math.abs(ball.vu); beep(300, 0.04); }
      if (ball.u < -0.5) { loseBall(); break; }

      if (ball.vu < 0 &&
          ball.u - BALL_R <= PADDLE_U + PADDLE_THICK / 2 &&
          ball.u - BALL_R >= PADDLE_U - 1.0 &&
          Math.abs(ball.v - paddleV) <= halfLen + BALL_R * 0.6) {
        const ratio = THREE.MathUtils.clamp((ball.v - paddleV) / halfLen, -1, 1);
        const ang = ratio * (Math.PI / 3);
        ball.speed = Math.min(ball.speed * 1.01, 16);
        ball.vu = Math.cos(ang) * ball.speed;
        ball.vv = Math.sin(ang) * ball.speed;
        ball.u = ballHomeU() + 0.01;
        beep(440, 0.05, 'sine', 0.06);
      }

      for (const b of blocks) {
        if (!b.alive) continue;
        const du = ball.u - b.u, dv = ball.v - b.v;
        if (Math.abs(du) < BLOCK_SU / 2 + BALL_R && Math.abs(dv) < BLOCK_SV / 2 + BALL_R) {
          const overlapU = BLOCK_SU / 2 + BALL_R - Math.abs(du);
          const overlapV = BLOCK_SV / 2 + BALL_R - Math.abs(dv);
          if (overlapU < overlapV) ball.vu = du > 0 ? Math.abs(ball.vu) : -Math.abs(ball.vu);
          else ball.vv = dv > 0 ? Math.abs(ball.vv) : -Math.abs(ball.vv);
          const cur = Math.hypot(ball.vu, ball.vv) || 1;
          ball.vu = ball.vu / cur * ball.speed;
          ball.vv = ball.vv / cur * ball.speed;
          b.alive = false;
          b.mesh.visible = false;
          burst(b.mesh.position.x, b.mesh.position.y, 0, ROW_COLORS[b.row % ROW_COLORS.length]);
          score += ROW_POINTS[b.row % ROW_POINTS.length];
          refreshHUD();
          beep(520 + (ROWS - b.row) * 90, 0.06, 'square', 0.045);
          if (blocks.every(x => !x.alive)) clearLevel();
          break;
        }
      }
    }
    if (state === 'playing') placeUV(ball.mesh, ball.u, ball.v, 0);

    ball.trailT += dt;
    if (ball.trailT > 0.016) {
      ball.trailT = 0;
      for (let i = ball.trail.length - 1; i > 0; i--) {
        ball.trail[i].position.copy(ball.trail[i - 1].position);
        ball.trail[i].material.opacity = state === 'playing' ? 0.16 * (1 - i / ball.trail.length) : 0;
        ball.trail[i].scale.setScalar(1 - i / (ball.trail.length + 2));
      }
      ball.trail[0].position.copy(ball.mesh.position);
      ball.trail[0].material.opacity = state === 'playing' ? 0.16 : 0;
    }
  }

  updateParticles(dt);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.033);
  if (state !== 'paused') step(dt);
  const t = performance.now() * 0.001;
  blockGroup.children.forEach((m, i) => {
    if (m.visible) m.material.emissiveIntensity = 0.15 + 0.07 * Math.sin(t * 1.6 + i * 0.35);
  });
  renderer.render(scene, camera);
}
buildField();
resetGame(1);
animate();
</script>
</body>
